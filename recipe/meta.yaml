{% set name = "xarray_selafin" %}
{% set version = "0.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 081935661f408c17593a02205f86a930de020b6c40c99db096b01034670a64a3

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python
  number: 0

requirements:
  host:
    - python >=3.9
    - pip
    - poetry-core >=1.0.0
    - poetry-dynamic-versioning
  run:
    - python >=3.9
    - numpy
    - xarray

test:
  imports:
    - xarray_selafin
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/seareport/xarray-selafin.git
  summary: 'xarray backend for Selafin formats'
  license: Unlicense
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - tomsail
    - pmav99
