{% set name = "xarray_selafin" %}
{% set version = "0.2.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4a380368602e8de992c0e7f0e35da278c200eedc74a1fb6617c643815e4cd08d

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python
  number: 0

requirements:
  host:
    - python >=3.9
    - pip
    - poetry-core >=1.0.0
    - poetry-dynamic-versioning
  run:
    - python >=3.9
    - numpy
    - xarray
    - python-serafin >=0.2

test:
  imports:
    - xarray_selafin
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/seareport/xarray-selafin.git
  summary: 'xarray backend for Selafin formats'
  license: Unlicense
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - tomsail
    - pmav99
